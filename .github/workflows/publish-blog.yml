# Publishes blog posts to the Tiles PDS as site.standard.document records.
# Sequoia writes the new record's atUri into a post's frontmatter the first
# time it is published; those edits are committed back so the next run
# updates the record instead of creating a duplicate.
name: Publish blog

on:
  push:
    branches: [main]
    paths:
      - "content/blog/**"
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-blog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # Don't leave the write token in .git/config while sequoia (a third-party
      # package) runs; only the push step below gets it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Publish to ATproto
        run: npx --yes sequoia-cli@0.5.7 publish
        env:
          ATP_IDENTIFIER: ${{ secrets.ATP_IDENTIFIER }}
          ATP_APP_PASSWORD: ${{ secrets.ATP_APP_PASSWORD }}
          PDS_URL: ${{ secrets.PDS_URL }}

      - name: Commit new atUris
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- content/blog; then
            echo "No frontmatter changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/blog
          git commit -m "Record ATproto URIs for published posts [skip ci]"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git pull --rebase "$remote" "$GITHUB_REF_NAME"
          git push "$remote" "HEAD:$GITHUB_REF_NAME"
