name: Verify Alpha 21 release render

on:
  push:
    branches:
      - verify-alpha21-release-copy
  pull_request:
    branches:
      - main

jobs:
  verify-release-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install site dependencies
        run: bun install
      - name: Install browser driver
        run: npm install --no-save playwright-core@1.55.0
      - name: Start Tiles site locally
        run: |
          bun run dev > /tmp/tiles-next-dev.log 2>&1 &
          echo $! > /tmp/tiles-next-dev.pid
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/releases > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/tiles-next-dev.log
          exit 1
      - name: Capture and verify releases page
        run: |
          node <<'NODE'
          const fs = require('fs')
          const { chromium } = require('playwright-core')

          ;(async () => {
            const browser = await chromium.launch({
              headless: true,
              executablePath: '/usr/bin/google-chrome',
              args: ['--no-sandbox'],
            })
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } })
            await page.goto('http://127.0.0.1:3000/releases', { waitUntil: 'networkidle', timeout: 120000 })
            await page.screenshot({ path: 'alpha21-releases.png', fullPage: true })
            const body = await page.locator('body').innerText()
            fs.writeFileSync('alpha21-releases.txt', body)

            const required = [
              'Alpha 21',
              'Quantization selection in Modelfiles with Ollama-style tags',
              'MTP speculative decoding now enables automatically',
              'Default model switched to Unsloth’s Gemma 4 12B GGUF at Q4_K_M',
              'Incomplete cached model snapshots now re-download a missing GGUF instead of failing',
            ]
            const forbidden = [
              'Remote-inference v0',
              'Decouple Pi agent from repl',
              'LLama-server refactors',
              'Chore: security patch upgrades',
              'Release 0.14.7',
            ]

            for (const text of required) {
              if (!body.includes(text)) throw new Error(`Missing rendered text: ${text}`)
            }
            for (const text of forbidden) {
              if (body.includes(text)) throw new Error(`Raw release text is still rendered: ${text}`)
            }

            await browser.close()
          })().catch((error) => {
            console.error(error)
            process.exit(1)
          })
          NODE
      - name: Print dev server log on failure
        if: failure()
        run: cat /tmp/tiles-next-dev.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpha21-release-render
          path: |
            alpha21-releases.png
            alpha21-releases.txt
